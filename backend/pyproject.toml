[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "b17-portal-api"
version = "0.1.0"
description = "B-17 Portal backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "fastapi>=0.143,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9,<10",
    "ruff>=0.17,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# The offline common-password corpus (and its provenance/license note) ships inside the package.
[tool.setuptools.package-data]
"app.core.security" = ["data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Starlette 1.8's TestClient prefers `httpx2`; this project keeps `httpx` as specified for 10B.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `alembic/` (our migrations directory) must not be mistaken for a first-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Generated migration scripts are reviewed for content, not line length.
"alembic/versions/*.py" = ["E501"]
# Tests favor readable single-line assertions and SQL over wrapping.
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
